[package]
name = "tokage-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Tokage headless command line interface"

[workspace]

[[bin]]
name = "tokage"
path = "src/main.rs"

[dependencies]
tokage-runtime = { path = "../src-tauri/crates/tokage-runtime" }
tokage-core = { path = "../src-tauri/crates/tokage-core" }
tokage-native = { path = "../src-tauri/crates/tokage-native" }
tokage-planning = { path = "../src-tauri/crates/tokage-planning" }
tokage-orchestration = { path = "../src-tauri/crates/tokage-orchestration" }
tokage-matching = { path = "../src-tauri/crates/tokage-matching" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

[dev-dependencies]
tempfile = "=3.27.0"
