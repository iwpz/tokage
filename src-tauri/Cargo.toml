[package]
name = "tokage"
version = "0.1.0"
description = "Multi-federation agent command center"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tokage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokage-core = { path = "crates/tokage-core" }
tokage-native = { path = "crates/tokage-native" }
tokage-storage = { path = "crates/tokage-storage" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
which = "7"
futures = "0.3"
tracing = "0.1"
similar = "=2.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
refinery = { version = "=0.10.0", features = ["rusqlite"] }
r2d2 = "=0.8.10"
r2d2_sqlite = "=0.35.0"
libc = "=0.2.190"
tempfile = "=3.27.0"
